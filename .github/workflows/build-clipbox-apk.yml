name: Build ClipBox50 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract Android project
        run: unzip -q '1ClipBox50_Android_Project (1).zip' -d project

      - name: Build debug APK
        working-directory: project/ClipBox50_APK
        run: gradle assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipBox50-debug-apk
          path: project/ClipBox50_APK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
