name: Build ClipBox50 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract Android project
        run: unzip -q '1ClipBox50_Android_Project (1).zip' -d project

      - name: Fix project configuration
        working-directory: project/ClipBox50_APK
        run: |
          python - <<'PY'
          from pathlib import Path
          gradle_file = Path('build.gradle')
          gradle_text = gradle_file.read_text()
          marker = '\nallprojects {'
          if marker in gradle_text:
              gradle_text = gradle_text.split(marker, 1)[0] + '\n'
          gradle_file.write_text(gradle_text)
          manifest = Path('app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text()
          manifest_text = manifest_text.replace('        android:icon="@mipmap/ic_launcher"\n', '')
          manifest_text = manifest_text.replace('        android:roundIcon="@mipmap/ic_launcher"\n', '')
          manifest.write_text(manifest_text)
          Path('gradle.properties').write_text('android.useAndroidX=true\nandroid.enableJetifier=true\n')
          PY

      - name: Build debug APK
        working-directory: project/ClipBox50_APK
        run: gradle assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipBox50-debug-apk
          path: project/ClipBox50_APK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
